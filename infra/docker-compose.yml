services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: nirvana_postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: nirvana
      POSTGRES_PASSWORD: nirvana_secret
      POSTGRES_DB: nirvana
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nirvana -d nirvana"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nirvana_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  risk-engine:
    build:
      context: ../services/risk-engine
      dockerfile: Dockerfile
    container_name: nirvana_risk_engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      PORT: 8000
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
    name: nirvana_postgres_data
